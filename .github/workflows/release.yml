name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-14
            label: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm derives the version from git tags
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ${{ !env.ACT && 'pip' || '' }}  # pip cache on GitHub; off under act, whose containers cannot run the post step

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import connflex_app; print(connflex_app.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version from git: $VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "setuptools-scm computed $VERSION for tag ${GITHUB_REF#refs/tags/}; is the tag on this commit and the checkout complete?" >&2
            exit 1
          fi

      - name: Install Linux runtime libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 \
            xvfb mesa-utils

      - name: Build with PyInstaller
        run: pyinstaller packaging/connflex.spec --noconfirm --clean

      - name: Headless self-test of the bundle (Linux)
        if: runner.os == 'Linux'
        run: dist/ConnFlex/ConnFlex --self-test

      - name: Headless self-test of the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The GUI build has no console; run through the console-less exe and read its exit code.
          $p = Start-Process -FilePath "dist\ConnFlex\ConnFlex.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Headless self-test of the bundle (macOS)
        if: runner.os == 'macOS'
        run: dist/ConnFlex.app/Contents/MacOS/ConnFlex --self-test

      - name: GUI smoke test (Linux, software OpenGL)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1600x1000x24" dist/ConnFlex/ConnFlex --smoke-test smoke-${{ matrix.label }}.png

      - name: GUI smoke test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: dist/ConnFlex.app/Contents/MacOS/ConnFlex --smoke-test smoke-${{ matrix.label }}.png

      - name: GUI smoke test (Windows, software OpenGL)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          QT_OPENGL: software
        run: |
          $p = Start-Process -FilePath "dist\ConnFlex\ConnFlex.exe" -ArgumentList "--smoke-test","smoke-${{ matrix.label }}.png" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C dist -czf "ConnFlex-${{ steps.version.outputs.version }}-linux-x64.tar.gz" ConnFlex

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\ConnFlex -DestinationPath "ConnFlex-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Package (macOS, ad-hoc signed DMG)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/ConnFlex.app
          hdiutil create -volname ConnFlex -srcfolder dist/ConnFlex.app -ov -format UDZO \
            "ConnFlex-${{ steps.version.outputs.version }}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}  # act has no GitHub artifact service; the archive is already in the job's workspace
        with:
          name: ConnFlex-${{ matrix.label }}
          path: |
            ConnFlex-*.tar.gz
            ConnFlex-*.zip
            ConnFlex-*.dmg
            smoke-*.png
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum ConnFlex-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: ConnFlex ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/ConnFlex-*.tar.gz
            artifacts/ConnFlex-*.zip
            artifacts/ConnFlex-*.dmg
            artifacts/SHA256SUMS.txt
