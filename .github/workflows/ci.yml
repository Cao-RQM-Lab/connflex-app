name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and headless tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check connflex_app tests examples packaging
      - name: Headless tests
        run: pytest -q
      - name: Self-test
        run: python -m connflex_app --self-test
