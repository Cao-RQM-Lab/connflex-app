name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and headless tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm derives the version from git tags
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ${{ !env.ACT && 'pip' || '' }}  # pip cache on GitHub; off under act, whose containers cannot run the post step
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check connflex_app tests examples packaging
      - name: Headless tests
        run: pytest -q
      - name: Self-test
        run: python -m connflex_app --self-test
