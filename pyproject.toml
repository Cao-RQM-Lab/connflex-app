[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connflex-app"
version = "0.1.0"
description = "Desktop GUI for connflex-core: GDS layouts to rigid-body/beam models, modes, and stiffness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connflex-core[gds]>=0.1.0",
    "PySide6>=6.6",
    "PyOpenGL>=3.1.6",
    "Pillow>=10",
    "numpy>=1.26",
    "shapely>=2.1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
connflex-app = "connflex_app.app:main"

[tool.setuptools.packages.find]
include = ["connflex_app*"]

[tool.setuptools.package-data]
connflex_app = ["data/*.gds", "data/*.toml", "data/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
