[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "connflex-app"
dynamic = ["version"]
description = "Desktop GUI for connflex-core: GDS layouts to rigid-body/beam models, modes, and stiffness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # Unreleased 0.2.0 with electrodes, capacitance, and transients: the electromechanical branch
    # until it is tagged. The box-layer override and GDS export also use connflex-core internals,
    # so pin to 0.2.x once it is on PyPI.
    "connflex-core[gds] @ git+https://github.com/Cao-RQM-Lab/connflex-core.git@electromechanical",
    "PySide6>=6.6",
    "PyOpenGL>=3.1.6",
    "Pillow>=10",
    "numpy>=1.26",
    "shapely>=2.1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11", "setuptools-scm>=8", "packaging>=23"]
dev = ["pytest>=8", "ruff>=0.5", "setuptools-scm>=8", "packaging>=23"]

[project.scripts]
connflex-app = "connflex_app.app:main"

[tool.setuptools.packages.find]
include = ["connflex_app*"]

[tool.setuptools_scm]
# The version is the latest git tag (vX.Y.Z); commits after a tag give X.Y.(Z+1).devN+g<sha>.
version_file = "connflex_app/_version.py"

[tool.setuptools.package-data]
connflex_app = ["data/*.gds", "data/*.toml", "data/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
